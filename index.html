<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lanewise Labs</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="stage" id="stage">
        <div class="flux" id="flux" aria-hidden="true"></div>
        <div class="scene" id="scene">
            <svg class="trail" id="trail" aria-hidden="true"><polyline id="trailLine" fill="none" stroke="#E8F2F7" stroke-opacity=".18" stroke-dasharray="4 8"/></svg>
            <div class="rocket" id="rocket" aria-hidden="true">
                <svg viewBox="0 0 200 80">
                    <g class="flame">
                    <path d="M42 26L-40 40L42 54Z" fill="#FF9F1C"/>
                    <path d="M42 31L-10 40L42 49Z" fill="#FFD23F"/>
                    <path d="M42 35L18 40L42 45Z" fill="#FFF3C4"/>
                    <path d="M34 22L-34 12L34 26Z" fill="#FF9F1C"/>
                    <path d="M34 58L-24 70L34 54Z" fill="#FF9F1C"/>
                    </g>
                    <path d="M78 22L60 2L100 18L104 24Z" fill="#8FA3B1"/>
                    <path d="M78 58L60 78L100 62L104 56Z" fill="#8FA3B1"/>
                    <path d="M60 2L68 5L63 11Z" fill="#E5384F"/>
                    <path d="M60 78L68 75L63 69Z" fill="#E5384F"/>
                    <rect x="36" y="26" width="14" height="28" rx="2" fill="#3A4A57"/>
                    <path d="M50 22H136Q148 22 148 30V50Q148 58 136 58H50Z" fill="#D5E2EA"/>
                    <path d="M50 40H148V50Q148 58 136 58H50Z" fill="#B3C5D0"/>
                    <path d="M78 22V58M104 22V58" stroke="#8FA3B1" stroke-width="1.5" fill="none"/>
                    <path d="M146 24C166 27 184 34 198 40C184 46 166 53 146 56Z" fill="#E5384F"/>
                    <path d="M146 40H198C184 46 166 53 146 56Z" fill="#B52B3E"/>
                    <circle cx="116" cy="40" r="11" fill="#6E8190"/>
                    <circle cx="116" cy="40" r="8" fill="#1B2B38"/>
                    <circle cx="116" cy="40" r="5" fill="#2447F5"/>
                    <circle cx="114" cy="38" r="1.8" fill="#E8F2F7"/>
                    <circle cx="132" cy="30" r="3" fill="#FF9F1C"/>
                    <circle cx="64" cy="50" r="3" fill="#FF9F1C"/>
                    </svg>
            </div>

            <h1 class="title" id="title" aria-label="Lanewise Labs"></h1>

            <div class="logo" id="logo">
                <svg viewBox="0 0 80 88" role="img" aria-label="Lanewise Labs logo">
                    <path d="M10 0V52A26 26 0 0 0 36 78H78" fill="none" stroke="#E8F2F7" stroke-width="16"/>
                    <path d="M32 0V44A12 12 0 0 0 44 56H78" fill="none" stroke="#00E0FF" stroke-width="16"/>
                </svg>
                <button class="bubble" id="bubble" type="button" aria-label="Open preview"><span class="tag">PREVIEW // LOCKED</span><span class="sk" id="bsk"></span><span class="hint">CLICK TO OPEN</span></button>
                <div class="shadow"></div>
            </div>

            <div class="fx" id="fx"></div>

            <div class="panel">
                <div class="hud"><i></i>ONLINE // W.I.S.E</div>
                <div class="dialog" id="dialog"></div>
                <nav class="opts" id="opts" aria-label="Main navigation">
                    <a class="opt" href="#services" data-name="Services">Services</a>
                    <a class="opt" href="#about" data-name="About Us">About Us</a>
                    <a class="opt" href="#portfolio" data-name="Portfolio">Portfolio</a>
                    <a class="opt" href="#contact" data-name="Contact Us">Contact Us</a>
                </nav>
            </div>

            <section class="win" id="win" aria-label="Page preview">
                <header class="wbar"><span id="wtitle"></span><span>STATUS // PLACEHOLDER</span><button class="wclose" id="wclose" type="button" aria-label="Close preview">X CLOSE</button></header>
                <div class="wbody" id="wbody"></div>
            </section>
            <div class="overlay" id="overlay">
                <div class="notice" role="dialog" aria-modal="true" aria-labelledby="ntext">
                    <div class="nbar"><span>// NEW CLIENT OFFER</span><span>STATUS: ACTIVE</span></div>
                    <p id="ntext">Our 1st 2 projects are free of charge!</p>
                    <button id="nok" type="button">GOT IT</button>
                </div>
            </div>
        </div>
    </div>
    <script src="flux-lines.js"></script>
    <script src="main.js"></script>
</body>
